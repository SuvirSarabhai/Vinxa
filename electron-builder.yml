appId: com.vinxa.desktop
productName: Vinxa Desktop
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/tray.ico
    to: tray.ico
  - from: resources/audio/default-output.ps1
    to: audio/default-output.ps1
asarUnpack:
  - "**/*.node"
win:
  icon: resources/tray.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}

